instdir: ./instances

instances:
  - repo: local
    items:
      - local

experiments:
  - name: test-fifo
    args:
      - python
      - simulator/test.py
      - --num_exp
      - "1"
      - --result_folder
      - "@OUTPUT_SUBDIR@"
      - "@EXTRA_ARGS@"
      - --test_schemes
      - spark_fifo
    stdout: out

  - name: capfifo
    args:
      - python
      - simulator/test.py
      - --num_exp
      - "100"
      - --result_folder
      - "@OUTPUT_SUBDIR@"
      - "@EXTRA_ARGS@"
      - --test_schemes
      - spark_fifo
      - cap_fifo
      - new_cap_fifo
      - cap_power
      - backfill_cap_fifo
      - dynamic_b_cap_fifo
      - efficiency_cap_fifo
      - lookahead_cap_fifo
      - weighted_cap_fifo
      - enhanced_cap_fifo
      - cap_power_enhanced_fifo
      - pcaps
      - --max_slowdown
      - "1.02"
    stdout: out

  - name: agent-variants
    args:
      - python
      - simulator/test_agent_variants.py
      - --agent
      - all
      - --variant_num_exp
      - "100"
      - --pidle_range
      - "0.0"
      - "1.0"
      - "0.05"
      - --variant_result_file
      - "@OUTPUT_SUBDIR@/agent_variants.csv"
      - "@EXTRA_ARGS@"
    stdout: out

  - name: agent-variants-enhanced
    args:
      - python
      - simulator/test_agent_variants.py
      - --agent
      - enhanced
      - --variant_num_exp
      - "100"
      - --pidle_range
      - "0.0"
      - "1.0"
      - "0.05"
      - --variant_result_file
      - "@OUTPUT_SUBDIR@/agent_variants.csv"
      - "@EXTRA_ARGS@"
    stdout: out

  - name: enhanced-capfifo
    args:
      - python
      - simulator/test_agent_variants.py
      - --agent
      - enhanced_cap_fifo
      - --variant_num_exp
      - "100"
      - --pidle_range
      - "0.0"
      - "1.0"
      - "0.05"
      - --variant_result_file
      - "@OUTPUT_SUBDIR@/agent_variants.csv"
      - "@EXTRA_ARGS@"
    stdout: out

  - name: all
    args:
      - python
      - simulator/test.py
      - --num_exp
      - "100"
      - --result_folder
      - "@OUTPUT_SUBDIR@"
      - "@EXTRA_ARGS@"
      - --test_schemes
      - spark_fifo
      - dynamic_partition
      - decima
      - green_hadoop
      - cap_fifo
      - new_cap_fifo
      - cap_partition
      - new_cap_partition
      - cap_decima
      - new_cap_decima
      - cap_power
      - backfill_cap_fifo
      - dynamic_b_cap_fifo
      - efficiency_cap_fifo
      - lookahead_cap_fifo
      - weighted_cap_fifo
      - enhanced_cap_fifo
      - cap_power_enhanced_fifo
      - pcaps
      - new_pcaps
    stdout: out

variants:
  - axis: exec-cap
    items:
      - name: cap100
        extra_args:
          - --exec_cap
          - "100"
      - name: cap50
        extra_args:
          - --exec_cap
          - "50"

  - axis: init-dags
    items:
      - name: init1
        extra_args:
          - --num_init_dags
          - "1"
      - name: init3
        extra_args:
          - --num_init_dags
          - "3"

  - axis: stream-dags
    items:
      - name: stream50
        extra_args:
          - --num_stream_dags
          - "50"
      - name: stream100
        extra_args:
          - --num_stream_dags
          - "100"
      - name: stream200
        extra_args:
          - --num_stream_dags
          - "200"

matrix:
  include:
    - experiments:
        - test-fifo
        - capfifo
        - all
        - enhanced-capfifo
      axes:
        - exec-cap
        - init-dags
        - stream-dags

    - experiments:
        - agent-variants
        - agent-variants-enhanced
      axes: []
